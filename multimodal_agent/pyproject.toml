[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multimodal-agent"
version = "0.1.0"
description = "Conversational agent (FastAPI + LangGraph) that talks to video_mcp_server over MCP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "click>=8.1",
    "loguru>=0.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "langchain-core>=0.3",
    "langchain-groq>=0.2",
    "langgraph>=0.2",
    "langchain-mcp-adapters>=0.1",
    "fastmcp>=2.0",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.1",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "asgi-lifespan",
]

[tool.hatch.build.targets.wheel]
packages = ["src/multimodal_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["multimodal_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"