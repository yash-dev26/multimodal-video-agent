server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── SPA fallback ────────────────────────────────────────────────────────
    # All paths that do not match a real file fall through to index.html so
    # React Router can handle client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Reverse proxy to the agent ──────────────────────────────────────────
    # In Docker Compose the agent is reachable at http://multimodal-agent:8080.
    # These locations let the browser talk to the API without any CORS issues
    # and without exposing the agent port publicly.
    #
    # Paths that need proxying:
    #   /chat, /upload-video, /process-video, /task-status/*, /reset-memory,
    #   /health, /media/*

    location ~ ^/(chat|upload-video|process-video|task-status|reset-memory|health)(/.*)?$ {
        proxy_pass         http://multimodal-agent:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;   # generous — LLM + tool calls can be slow
        proxy_send_timeout 60s;
        client_max_body_size 500M;  # allow large video uploads
    }

    location /media/ {
        proxy_pass         http://multimodal-agent:8080/media/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_read_timeout 30s;
    }

    # ── Security headers ────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff" always;

    # ── Compression ─────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;
}
