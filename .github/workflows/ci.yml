name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Build-check: catches Dockerfile/dependency breakage before it ────────
  # reaches anyone. No push, just a local build per service image.
  build-check:
    name: Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, multimodal_agent, video_mcp_server]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          tags: ${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ── Lint + unit: near-free, no external services needed at all ──────────
  lint-and-unit:
    name: Lint + unit (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [multimodal_agent, video_mcp_server]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            ${{ matrix.service }}/pyproject.toml

      - name: Install dependencies
        run: |
          pip install -e ".[test]"
          if [ "${{ matrix.service }}" = "multimodal_agent" ]; then
            pip install -e ../video_mcp_server
          fi

      - name: Unit tests (U1-U5)
        run: pytest tests/unit -v

  # ── Integration: video_mcp_server side (I1, I10) -- no Postgres needed ──
  integration-mcp:
    name: Integration (video_mcp_server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video_mcp_server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            video_mcp_server/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[test]"

      - name: "Integration tests (I1: MCP contract, I10: concurrency)"
        run: pytest tests/integration -v

  # ── Integration: multimodal_agent side (I2-I9) -- needs real Postgres ───
  # for the LangGraph checkpointer; everything else (LLMs, MCP) is faked.
  integration-agent:
    name: Integration (multimodal_agent)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: multimodal_agent
    env:
      TEST_CHECKPOINTER_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            multimodal_agent/pyproject.toml

      - name: Install dependencies
        run: |
          pip install -e ".[test]"
          pip install -e ../video_mcp_server

      - name: Integration tests (I2-I9)
        run: pytest tests/integration -v

  # ── Single required status check for branch protection ──────────────────
  # Point branch protection at THIS job instead of the four above, so
  # adding/renaming a matrix leg later doesn't require touching protection
  # rules separately.
  ci-success:
    name: CI success
    runs-on: ubuntu-latest
    needs: [build-check, lint-and-unit, integration-mcp, integration-agent]
    if: always()
    steps:
      - name: Fail if any required job failed or was cancelled
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs did not succeed."
            exit 1
          fi
          echo "All required jobs succeeded."