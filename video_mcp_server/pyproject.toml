[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-mcp-server"
version = "0.1.0"
description = "FastMCP server that owns video ingestion, indexing, multimodal search, and clip extraction."
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0",
    "pixeltable",
    "openai",
    "langsmith",
    "loguru",
    "click>=8.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pillow",
    "moviepy",
    "av",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
]

[tool.hatch.build.targets.wheel]
packages = ["src/video_mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"