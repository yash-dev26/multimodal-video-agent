services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: multimodal_agent
      POSTGRES_PASSWORD: multimodal_agent
      POSTGRES_DB: multimodal_agent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - agent-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multimodal_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  video-mcp-server:
    build: ./video_mcp_server
    env_file: ./video_mcp_server/.env
    environment:
      # Pixeltable uses this external Compose database instead of starting
      # its embedded PostgreSQL server under /root/.pixeltable/pgdata.
      - PIXELTABLE_DB_CONNECT_STR=postgresql://multimodal_agent:multimodal_agent@postgres:5432/multimodal_agent
    ports:
      - "9090:9090"
    volumes:
      - ./video_mcp_server/data:/app/videos
      # Persists Pixeltable config and file cache; catalog data lives in Compose PostgreSQL.
      - ./video_mcp_server/.pixeltable:/root/.pixeltable
      - ./video_mcp_server/.records:/app/.records
      - ~/.cache/huggingface:/root/.cache/huggingface
      # Shared volume: clips written by this container (./shared_media/*.mp4)
      # are immediately accessible to multimodal-agent's /media route.
      - shared_media:/app/shared_media
    networks:
      - agent-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.create_connection(('localhost', 9090), 2); s.close()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  multimodal-agent:
    build: ./multimodal_agent
    env_file: ./multimodal_agent/.env
    environment:
      - IN_DOCKER=true
      - CHECKPOINTER_DB_URL=postgresql://multimodal_agent:multimodal_agent@postgres:5432/multimodal_agent
      # MCP server — When running outside Docker, config.py automatically
      # defaults or adapts this to http://localhost:9090/mcp.
      - MCP_SERVER=http://video-mcp-server:9090/mcp
    ports:
      - "8080:8080"
    volumes:
      - shared_media:/app/shared_media
    depends_on:
      postgres:
        condition: service_healthy
      video-mcp-server:
        condition: service_healthy
    networks:
      - agent-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    ports:
      - "3000:80"
    depends_on:
      multimodal-agent:
        condition: service_healthy
    networks:
      - agent-net

networks:
  agent-net:

volumes:
  shared_media:
  postgres_data:
